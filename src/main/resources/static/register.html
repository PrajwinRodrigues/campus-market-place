<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Campus Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container page-content">
    <div class="form-card">
      <h1>Create your account</h1>
      <div id="alert" class="alert" hidden></div>

      <form id="registerForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" required maxlength="120" />
        </div>
        <div class="field">
          <label for="email">College email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" />
          <div class="helper-text">At least 8 characters.</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="phone">Phone (optional)</label>
            <input id="phone" name="phone" type="tel" />
          </div>
          <div class="field">
            <label for="collegeName">College (optional)</label>
            <input id="collegeName" name="collegeName" type="text" />
          </div>
        </div>
        <div class="field">
          <label for="hostelOrLocation">Hostel / location (optional)</label>
          <input id="hostelOrLocation" name="hostelOrLocation" type="text" />
        </div>
        <button type="submit" class="btn btn-block">Sign up</button>
      </form>

      <div class="form-footer-link">
        Already have an account? <a href="/login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
