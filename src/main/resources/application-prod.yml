spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Keep schema updates enabled for the current prototype. Use a migration tool
    # and switch to validate before serving real user data.
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    # A missing or short key intentionally prevents production startup.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:/tmp/campus-marketplace-uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    required: ${CLOUDINARY_REQUIRED:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

logging:
  level:
    com.campusmarket: INFO
